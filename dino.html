<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Dino Runner</title>
    <style>
        :root {
            --bg-color: #121212;
            --canvas-bg: #1e1e1e;
            --text-color: #f7f7f7;
            --card-bg: rgba(28, 28, 30, 0.95);
            --primary-blue: #2196f3;
            --btn-hover: #1976d2;
            --accent-red: #ff5252;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Game Container */
        .game-container {
            position: relative;
            width: 800px;
            max-width: 100vw;
            height: 300px;
            background: var(--canvas-bg);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* Canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: var(--canvas-bg);
        }

        /* HUD Overlay */
        .hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 18px;
            letter-spacing: 1px;
            pointer-events: none;
            color: var(--text-color);
            z-index: 5;
        }

        .hud button {
            pointer-events: auto;
        }

        .scores span {
            margin-right: 20px;
        }

        /* UI Overlays */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .overlay-card {
            background: var(--card-bg);
            padding: 30px 45px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
            border: 1px solid #444;
            backdrop-filter: blur(4px);
        }

        .overlay-card.hidden {
            display: none;
        }

        .overlay-card.active {
            display: block;
        }

        .overlay-card h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: var(--primary-blue);
            letter-spacing: 2px;
        }

        .overlay-card h1.danger {
            color: var(--accent-red);
        }

        .overlay-card p {
            margin-bottom: 8px;
            font-size: 14px;
            color: #cccccc;
        }

        .final-score-text {
            font-size: 22px !important;
            font-weight: bold;
            color: #ffffff !important;
            margin: 15px 0 !important;
        }

        /* Buttons */
        .btn {
            margin-top: 15px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: var(--primary-blue);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--btn-hover);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Mobile Touch Controls */
        .touch-controls {
            display: none;
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: auto;
            z-index: 5;
        }

        .touch-btn {
            background: rgba(33, 150, 243, 0.25);
            color: #ffffff;
            border: 2px solid var(--primary-blue);
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            touch-action: manipulation;
            backdrop-filter: blur(2px);
        }

        .touch-btn:active {
            background: rgba(33, 150, 243, 0.6);
        }

        @media (max-width: 768px) {
            .game-container {
                width: 100vw;
                height: 60vh;
                border-radius: 0;
                border: none;
            }

            .touch-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div class="game-container" id="gameContainer">
        <canvas id="gameCanvas" width="800" height="300"></canvas>

        <div class="hud">
            <div class="scores">
                <span>HI: <strong id="highScoreVal">00000</strong></span>
                <span>SCORE: <strong id="scoreVal">00000</strong></span>
            </div>
            <button id="pauseBtn" class="icon-btn" aria-label="Pause Game">⏸</button>
        </div>

        <div id="uiOverlay" class="ui-overlay">
            <div id="startScreen" class="overlay-card active">
                <h1>CYBER DINO</h1>
                <p>Press <strong>Space</strong> or <strong>Up Arrow</strong> to Jump</p>
                <p>Press <strong>Down Arrow</strong> to Crouch</p>
                <p>Press <strong>P</strong> to Pause</p>
                <button id="startBtn" class="btn">START GAME</button>
            </div>

            <div id="gameOverScreen" class="overlay-card hidden">
                <h1 class="danger">SYSTEM CRASH</h1>
                <p class="final-score-text">Final Score: <span id="finalScore">0</span></p>
                <button id="restartBtn" class="btn">RETRY</button>
            </div>
        </div>

        <div class="touch-controls">
            <button id="touchCrouch" class="touch-btn crouch-btn">CROUCH</button>
            <button id="touchJump" class="touch-btn jump-btn">JUMP</button>
        </div>
    </div>

    <script>
        // Synthesized Audio Engine
        class SoundEffects {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) {
                        this.ctx = new AudioContextClass();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playJump() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(420, this.ctx.currentTime + 0.15);
                    
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                    
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.15);
                } catch (e) {}
            }

            playHit() {
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const notes = [220, 164.81, 130.81, 98];
                    notes.forEach((freq, index) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now + index * 0.08);
                        osc.frequency.exponentialRampToValueAtTime(freq * 0.8, now + index * 0.08 + 0.07);

                        gain.gain.setValueAtTime(0.2, now + index * 0.08);
                        gain.gain.linearRampToValueAtTime(0.01, now + index * 0.08 + 0.07);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);

                        osc.start(now + index * 0.08);
                        osc.stop(now + index * 0.08 + 0.08);
                    });

                    const noiseOsc = this.ctx.createOscillator();
                    const noiseGain = this.ctx.createGain();

                    noiseOsc.type = 'square';
                    noiseOsc.frequency.setValueAtTime(80, now);
                    noiseOsc.frequency.exponentialRampToValueAtTime(20, now + 0.35);

                    noiseGain.gain.setValueAtTime(0.3, now);
                    noiseGain.gain.linearRampToValueAtTime(0.01, now + 0.35);

                    noiseOsc.connect(noiseGain);
                    noiseGain.connect(this.ctx.destination);

                    noiseOsc.start(now);
                    noiseOsc.stop(now + 0.35);
                } catch (e) {}
            }

            playScore() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08);
                    
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                    
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.2);
                } catch (e) {}
            }
        }

        const audio = new SoundEffects();

        const STATES = {
            START: 'START',
            PLAYING: 'PLAYING',
            PAUSED: 'PAUSED',
            GAMEOVER: 'GAMEOVER'
        };

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.state = STATES.START;
                this.score = 0;
                this.highScore = localStorage.getItem('cyber_dino_high_score') || 0;
                this.speed = 6;
                this.baseSpeed = 6;
                this.maxSpeed = 14;
                this.lastTime = 0;

                this.initUI();
                this.initControls();

                this.dino = new Player(this);
                this.obstacles = [];
                this.clouds = [];
                this.groundX = 0;
                this.obstacleTimer = 0;

                requestAnimationFrame(this.loop.bind(this));
            }

            initUI() {
                this.startScreen = document.getElementById('startScreen');
                this.gameOverScreen = document.getElementById('gameOverScreen');
                this.startBtn = document.getElementById('startBtn');
                this.restartBtn = document.getElementById('restartBtn');
                this.pauseBtn = document.getElementById('pauseBtn');
                this.scoreDisplay = document.getElementById('scoreVal');
                this.highScoreDisplay = document.getElementById('highScoreVal');
                this.finalScoreDisplay = document.getElementById('finalScore');

                this.highScoreDisplay.textContent = this.formatScore(this.highScore);

                this.startBtn.addEventListener('click', () => {
                    audio.init();
                    this.start();
                });

                this.restartBtn.addEventListener('click', () => {
                    this.reset();
                    this.start();
                });

                this.pauseBtn.addEventListener('click', () => {
                    this.togglePause();
                });
            }

            initControls() {
                window.addEventListener('keydown', (e) => {
                    audio.init();
                    if ((e.code === 'Space' || e.code === 'ArrowUp') && this.state === STATES.PLAYING) {
                        e.preventDefault();
                        if (this.dino.jump()) audio.playJump();
                    }
                    if (e.code === 'ArrowDown' && this.state === STATES.PLAYING) {
                        e.preventDefault();
                        this.dino.setCrouch(true);
                    }
                    if (e.code === 'KeyP') {
                        this.togglePause();
                    }
                });

                window.addEventListener('keyup', (e) => {
                    if (e.code === 'ArrowDown') {
                        this.dino.setCrouch(false);
                    }
                });

                const jumpBtn = document.getElementById('touchJump');
                const crouchBtn = document.getElementById('touchCrouch');

                jumpBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    audio.init();
                    if (this.state === STATES.PLAYING && this.dino.jump()) {
                        audio.playJump();
                    }
                }, { passive: false });

                crouchBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (this.state === STATES.PLAYING) this.dino.setCrouch(true);
                }, { passive: false });

                crouchBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.dino.setCrouch(false);
                }, { passive: false });
            }

            start() {
                this.state = STATES.PLAYING;
                this.startScreen.classList.remove('active');
                this.startScreen.classList.add('hidden');
                this.gameOverScreen.classList.remove('active');
                this.gameOverScreen.classList.add('hidden');
                this.pauseBtn.textContent = '⏸';
            }

            reset() {
                this.score = 0;
                this.speed = this.baseSpeed;
                this.obstacles = [];
                this.dino.reset();
                this.scoreDisplay.textContent = this.formatScore(0);
            }

            togglePause() {
                if (this.state === STATES.PLAYING) {
                    this.state = STATES.PAUSED;
                    this.pauseBtn.textContent = '▶';
                } else if (this.state === STATES.PAUSED) {
                    this.state = STATES.PLAYING;
                    this.pauseBtn.textContent = '⏸';
                }
            }

            gameOver() {
                this.state = STATES.GAMEOVER;
                audio.playHit();

                if (this.score > this.highScore) {
                    this.highScore = Math.floor(this.score);
                    localStorage.setItem('cyber_dino_high_score', this.highScore);
                    this.highScoreDisplay.textContent = this.formatScore(this.highScore);
                }

                this.finalScoreDisplay.textContent = Math.floor(this.score);
                this.gameOverScreen.classList.remove('hidden');
                this.gameOverScreen.classList.add('active');
            }

            formatScore(num) {
                return String(Math.floor(num)).padStart(5, '0');
            }

            loop(timestamp) {
                const deltaTime = timestamp - this.lastTime;
                this.lastTime = timestamp;

                if (this.state === STATES.PLAYING) {
                    this.update(deltaTime);
                }
                
                this.render();
                requestAnimationFrame(this.loop.bind(this));
            }

            update(dt) {
                this.score += 0.15;

                if (Math.floor(this.score) % 100 === 0 && Math.floor(this.score) > 0 && Math.floor(this.score * 10) % 10 === 0) {
                    audio.playScore();
                }

                if (this.speed < this.maxSpeed) {
                    this.speed += 0.0008;
                }

                this.scoreDisplay.textContent = this.formatScore(this.score);
                this.dino.update();

                this.groundX = (this.groundX - this.speed) % 20;

                if (Math.random() < 0.008) {
                    this.clouds.push(new Cloud(this.canvas.width));
                }

                this.clouds.forEach(c => c.update(this.speed * 0.25));
                this.clouds = this.clouds.filter(c => !c.isOffscreen());

                this.obstacleTimer++;
                if (this.obstacleTimer > Math.max(45, 95 - this.speed * 3) && Math.random() < 0.06) {
                    this.spawnObstacle();
                    this.obstacleTimer = 0;
                }

                for (let i = this.obstacles.length - 1; i >= 0; i--) {
                    const obs = this.obstacles[i];
                    obs.update(this.speed);

                    if (this.checkCollision(this.dino, obs)) {
                        this.gameOver();
                    }

                    if (obs.isOffscreen()) {
                        this.obstacles.splice(i, 1);
                    }
                }
            }

            spawnObstacle() {
                const rand = Math.random();
                if (rand < 0.35) {
                    this.obstacles.push(new Cactus(this.canvas.width, 'small'));
                } else if (rand < 0.65) {
                    this.obstacles.push(new Cactus(this.canvas.width, 'large'));
                } else if (rand < 0.8) {
                    this.obstacles.push(new Cactus(this.canvas.width, 'group'));
                } else {
                    this.obstacles.push(new Bird(this.canvas.width));
                }
            }

            checkCollision(dino, obstacle) {
                const dBox = dino.getHitbox();
                const oBox = obstacle.getHitbox();

                return (
                    dBox.x < oBox.x + oBox.w &&
                    dBox.x + dBox.w > oBox.x &&
                    dBox.y < oBox.y + oBox.h &&
                    dBox.y + dBox.h > oBox.y
                );
            }

            render() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                this.clouds.forEach(c => c.draw(this.ctx));

                this.ctx.strokeStyle = '#444444';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.moveTo(0, 250);
                this.ctx.lineTo(this.canvas.width, 250);
                this.ctx.stroke();

                this.ctx.fillStyle = '#333333';
                for (let x = this.groundX; x < this.canvas.width; x += 20) {
                    this.ctx.fillRect(x, 252, 4, 2);
                }

                this.obstacles.forEach(o => o.draw(this.ctx));
                this.dino.draw(this.ctx);
            }
        }

        class Player {
            constructor(game) {
                this.game = game;
                this.x = 50;
                this.groundY = 250;
                this.w = 40;
                this.h = 50;
                this.y = this.groundY - this.h;

                this.vy = 0;
                this.gravity = 0.65;
                this.jumpForce = -12.5;
                this.isJumping = false;
                this.isCrouching = false;
                this.legFrame = 0;
            }

            reset() {
                this.y = this.groundY - this.h;
                this.vy = 0;
                this.isJumping = false;
                this.isCrouching = false;
            }

            jump() {
                if (!this.isJumping) {
                    this.vy = this.jumpForce;
                    this.isJumping = true;
                    return true;
                }
                return false;
            }

            setCrouch(crouch) {
                if (this.isJumping) return;
                this.isCrouching = crouch;
                if (crouch) {
                    this.h = 30;
                    this.w = 55;
                    this.y = this.groundY - this.h;
                } else {
                    this.h = 50;
                    this.w = 40;
                    this.y = this.groundY - this.h;
                }
            }

            update() {
                this.vy += this.gravity;
                this.y += this.vy;

                if (this.y + this.h >= this.groundY) {
                    this.y = this.groundY - this.h;
                    this.vy = 0;
                    this.isJumping = false;
                }

                this.legFrame += 0.25;
            }

            getHitbox() {
                return {
                    x: this.x + 4,
                    y: this.y + 4,
                    w: this.w - 8,
                    h: this.h - 8
                };
            }

            draw(ctx) {
                ctx.fillStyle = '#2196F3';

                if (this.isCrouching) {
                    ctx.fillRect(this.x, this.y + 10, this.w, this.h - 10);
                    ctx.fillRect(this.x + 35, this.y, 20, 15);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(this.x + 48, this.y + 3, 4, 4);
                } else {
                    ctx.fillRect(this.x + 5, this.y + 15, 25, 25);
                    ctx.fillRect(this.x + 15, this.y, 25, 20);
                    ctx.fillRect(this.x, this.y + 20, 8, 10);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(this.x + 30, this.y + 4, 4, 4);

                    ctx.fillStyle = '#2196F3';
                    if (this.isJumping) {
                        ctx.fillRect(this.x + 8, this.y + 40, 6, 10);
                        ctx.fillRect(this.x + 20, this.y + 40, 6, 10);
                    } else {
                        const legOffset = Math.sin(this.legFrame) * 6;
                        ctx.fillRect(this.x + 8, this.y + 40, 6, 10 + legOffset);
                        ctx.fillRect(this.x + 22, this.y + 40, 6, 10 - legOffset);
                    }
                }
            }
        }

        class Cactus {
            constructor(x, type) {
                this.x = x;
                this.type = type;
                this.groundY = 250;

                if (type === 'small') {
                    this.w = 20;
                    this.h = 40;
                } else if (type === 'large') {
                    this.w = 28;
                    this.h = 55;
                } else {
                    this.w = 55;
                    this.h = 42;
                }

                this.y = this.groundY - this.h;
            }

            update(speed) {
                this.x -= speed;
            }

            isOffscreen() {
                return this.x + this.w < 0;
            }

            getHitbox() {
                return { x: this.x, y: this.y, w: this.w, h: this.h };
            }

            draw(ctx) {
                ctx.fillStyle = '#ff7043';

                if (this.type === 'group') {
                    ctx.fillRect(this.x, this.y + 10, 12, this.h - 10);
                    ctx.fillRect(this.x + 18, this.y, 16, this.h);
                    ctx.fillRect(this.x + 38, this.y + 8, 14, this.h - 8);
                } else {
                    ctx.fillRect(this.x + this.w * 0.3, this.y, this.w * 0.4, this.h);
                    ctx.fillRect(this.x, this.y + this.h * 0.3, this.w, 6);
                    ctx.fillRect(this.x, this.y + this.h * 0.15, 5, this.h * 0.2);
                    ctx.fillRect(this.x + this.w - 5, this.y + this.h * 0.1, 5, this.h * 0.25);
                }
            }
        }

        class Bird {
            constructor(x) {
                this.x = x;
                this.w = 38;
                this.h = 26;
                
                const heights = [220, 190, 165]; 
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.wingFrame = 0;
            }

            update(speed) {
                this.x -= (speed + 1.5);
                this.wingFrame += 0.18;
            }

            isOffscreen() {
                return this.x + this.w < 0;
            }

            getHitbox() {
                return { x: this.x + 2, y: this.y + 2, w: this.w - 4, h: this.h - 4 };
            }

            draw(ctx) {
                ctx.fillStyle = '#ba68c8';
                ctx.fillRect(this.x + 10, this.y + 10, 20, 10);
                ctx.fillRect(this.x, this.y + 8, 10, 8);
                
                const wingY = Math.sin(this.wingFrame) > 0 ? -10 : 12;
                ctx.fillRect(this.x + 12, this.y + 10 + wingY, 8, 10);
            }
        }

        class Cloud {
            constructor(x) {
                this.x = x;
                this.y = Math.random() * 90 + 20;
                this.w = Math.random() * 30 + 40;
                this.h = 14;
            }

            update(speed) {
                this.x -= speed;
            }

            isOffscreen() {
                return this.x + this.w < 0;
            }

            draw(ctx) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.fillRect(this.x + 10, this.y - 5, this.w - 20, this.h);
            }
        }

        window.addEventListener('load', () => {
            new Game();
        });
    </script>
</body>
</html>
